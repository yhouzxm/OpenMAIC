name: Zhiban Identity PG16 Security

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Full signoff or targeted recovery verification'
        type: choice
        required: true
        default: full
        options:
          - full
          - recovery
  push:
    branches:
      - verify/identity-pg16-3b2

jobs:
  identity-pg16:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zhiban_pg16_test
          POSTGRES_PASSWORD: ci-temporary-pg16-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zhiban_pg16_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ZB_PG16_ADMIN_URL: postgresql://postgres:ci-temporary-pg16-password@localhost:5432/zhiban_pg16_test
      ZB_PG16_ROLE_PASSWORD: ci-temporary-runtime-password
      ZB_PG16_REQUIRED: '1'
      ZB_PG16_DISPOSABLE: '1'
      IDENTITY_SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'full' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate selected suite
        shell: bash
        run: |
          set -euo pipefail
          case "$IDENTITY_SUITE" in
            full|recovery) printf 'IDENTITY SUITE: %s\n' "$IDENTITY_SUITE" ;;
            *) echo INVALID_IDENTITY_SUITE; exit 1 ;;
          esac
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify actual PostgreSQL 16 service and psql client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql -X -v ON_ERROR_STOP=1 "$ZB_PG16_ADMIN_URL" -c 'SELECT version();' -c 'SHOW server_version;'
          major="$(psql -X -At -v ON_ERROR_STOP=1 "$ZB_PG16_ADMIN_URL" -c 'SHOW server_version;' | cut -d. -f1)"
          if [ "$major" != 16 ]; then
            echo WRONG_POSTGRES_VERSION
            exit 1
          fi
      - name: Real PostgreSQL 16 security suite (two complete runs)
        if: env.IDENTITY_SUITE == 'full'
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2; do
            echo "PG16 SUITE RUN ${pass}"
            pnpm exec vitest run tests/zhiban/identity/postgres/pg16-role-bootstrap.test.ts
            pnpm exec vitest run tests/zhiban/identity/postgres/pg16-migration-runner.test.ts
            pnpm exec vitest run tests/zhiban/identity/postgres/pg16-schema-security.test.ts
            pnpm exec vitest run tests/zhiban/identity/postgres/pg16-rls.test.ts
            pnpm exec vitest run tests/zhiban/identity/postgres/pg16-transactions.test.ts
            pnpm exec vitest run tests/zhiban/identity/postgres/pg16-repository-signoff.test.ts
            pnpm exec vitest run tests/zhiban/identity/postgres/pg16-credentials.test.ts
            pnpm exec vitest run tests/zhiban/identity/postgres/pg16-sessions.test.ts
            pnpm exec vitest run tests/zhiban/identity/postgres/pg16-authorization.test.ts
            pnpm exec vitest run tests/zhiban/identity/postgres/pg16-identity-composition.test.ts
            pnpm exec vitest run tests/zhiban/identity/postgres/pg16-membership-composition.test.ts
            pnpm exec vitest run tests/zhiban/identity/postgres/pg16-identity-http.test.ts
            pnpm exec vitest run tests/zhiban/identity/postgres/pg16-manual-recovery.test.ts
            echo "PG16 SUITE RUN ${pass} PASS"
          done
      - name: Recovery PostgreSQL 16 verification (two complete runs)
        if: env.IDENTITY_SUITE == 'recovery'
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2; do
            echo "RECOVERY PG16 RUN ${pass}"
            pnpm exec vitest run tests/zhiban/identity/postgres/pg16-migration-runner.test.ts --reporter=verbose
            pnpm exec vitest run tests/zhiban/identity/postgres/pg16-manual-recovery.test.ts --reporter=verbose
            echo "RECOVERY PG16 RUN ${pass} PASS"
          done
      - name: Identity static, Domain and Port contract regression
        if: env.IDENTITY_SUITE == 'full'
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vitest run tests/zhiban/identity/postgres/bootstrap-role-contract.test.ts tests/zhiban/identity/postgres/migration-contract.test.ts tests/zhiban/identity/postgres/migrate-runner.test.ts
          pnpm exec vitest run tests/zhiban/identity/domain tests/zhiban/identity/contracts
          pnpm exec vitest run tests/zhiban/identity/credentials tests/zhiban/identity/postgres/credential-repository.test.ts tests/zhiban/identity/postgres/credential-schema.test.ts
          pnpm exec vitest run tests/zhiban/identity/sessions tests/zhiban/identity/postgres/session-repository.test.ts tests/zhiban/identity/postgres/session-schema.test.ts
          pnpm exec vitest run tests/zhiban/identity/postgres/global-repositories.test.ts tests/zhiban/identity/postgres/membership-repository.test.ts tests/zhiban/identity/postgres/mappers.test.ts tests/zhiban/identity/postgres/transactions.test.ts tests/zhiban/identity/postgres/persistence-authenticity.test.ts
          pnpm exec vitest run tests/zhiban/identity/authorization tests/zhiban/identity/postgres/authorization-repository.test.ts tests/zhiban/identity/postgres/authorization-schema.test.ts
          pnpm exec vitest run tests/zhiban/identity/use-cases tests/zhiban/identity/postgres/identity-composition-schema.test.ts
          pnpm exec vitest run tests/zhiban/identity/postgres/membership-composition-schema.test.ts
          pnpm exec vitest run tests/zhiban/identity/http --maxWorkers=1 --no-file-parallelism
          pnpm exec vitest run tests/zhiban/identity/recovery tests/zhiban/identity/postgres/manual-recovery-schema.test.ts --maxWorkers=1 --no-file-parallelism
      - name: Recovery repair static and composition regression
        if: env.IDENTITY_SUITE == 'recovery'
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vitest run tests/zhiban/identity/postgres/migration-contract.test.ts tests/zhiban/identity/postgres/migrate-runner.test.ts tests/zhiban/identity/postgres/manual-recovery-schema.test.ts tests/zhiban/identity/recovery/composition.test.ts --maxWorkers=1 --no-file-parallelism
      - name: Root lint and typecheck
        if: env.IDENTITY_SUITE == 'full'
        shell: bash
        run: |
          set -euo pipefail
          pnpm lint
          NODE_OPTIONS=--max-old-space-size=8192 pnpm exec tsc --noEmit
