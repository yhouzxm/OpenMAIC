name: Zhiban v1.3 PG18 application, logical import and restore

# Prepared candidate. No push, pull_request or schedule trigger.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zhiban-pg18-acceptance
  cancel-in-progress: false

jobs:
  pg18-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: zhiban-pg18-acceptance
    env:
      PG16_DEB_VERSION: '16.15-1.pgdg24.04+2'
      PG18_DEB_VERSION: '18.6-1.pgdg24.04+2'
      ZHIBAN_PG18_BIN: /usr/lib/postgresql/18/bin
      APPROVED_WORKFLOW_SHA: ${{ vars.ZHIBAN_PG18_APPROVED_SHA }}
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Require approved revision and private synthetic namespace
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ && "$GITHUB_SHA" == "$APPROVED_WORKFLOW_SHA" ]]
          umask 077
          PG18_ACCEPTANCE_ROOT="$RUNNER_TEMP/zhiban-pg18-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          PG18_PUBLIC_REPORT="$RUNNER_TEMP/zhiban-pg18-report-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          mkdir "$PG18_ACCEPTANCE_ROOT"
          printf '%s\n' "PG18_ACCEPTANCE_ROOT=$PG18_ACCEPTANCE_ROOT" \
            "PG18_PUBLIC_REPORT=$PG18_PUBLIC_REPORT" >> "$GITHUB_ENV"
          git config --global http.version HTTP/1.1

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch only the pinned official source needed by the reuse verifier
        run: |
          set -euo pipefail
          git -c http.version=HTTP/1.1 fetch --no-tags --depth=1 \
            https://github.com/THU-MAIC/OpenMAIC.git c0f296aa36096ec3d1e1e2b94a7a48e20075e0a1
          [[ "$(git rev-parse FETCH_HEAD)" == c0f296aa36096ec3d1e1e2b94a7a48e20075e0a1 ]]

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install pinned runtimes and clean source dependencies
        run: |
          set -euo pipefail
          npm install --global pnpm@10.28.0 --ignore-scripts
          bash scripts/zhiban-ci/install-pg18-prerequisites.sh
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Verify source-built expected profiles, application and PG18 restore
        run: |
          set -euo pipefail
          umask 077
          node scripts/zhiban-deploy/pg18-acceptance.cjs run "$PG18_ACCEPTANCE_ROOT" "$PG18_PUBLIC_REPORT"

      - name: Stop only owned processes and destroy private synthetic material
        if: always()
        run: |
          set -euo pipefail
          if [[ -d "${PG18_ACCEPTANCE_ROOT:-}" && -f scripts/zhiban-deploy/pg18-acceptance.cjs ]]; then
            node scripts/zhiban-deploy/pg18-acceptance.cjs cleanup "$PG18_ACCEPTANCE_ROOT"
            rm -rf -- "$PG18_ACCEPTANCE_ROOT"
          fi

      - name: Retain only allowlisted public summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zhiban-pg18-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PG18_PUBLIC_REPORT }}
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
