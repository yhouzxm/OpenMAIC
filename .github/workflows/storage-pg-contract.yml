name: Storage PostgreSQL Contract

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Full contract or targeted Bridge native recheck'
        type: choice
        required: true
        default: full
        options:
          - full
          - bridge-recheck
  push:
    branches: [main]
  pull_request:
    branches: [main, runtime-server-backend, feat/maic-editor-v0, feat/maic-editor-v1]

concurrency:
  group: storage-pg-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storage-pg-contract:
    name: Storage Contract (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: openmaic
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d openmaic"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PG_CONTRACT_URL: postgresql://postgres:postgres@localhost:5432/openmaic
      STORAGE_PG_CONTRACT_REQUIRED: '1'
      STORAGE_SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'full' }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate selected suite
        shell: bash
        run: |
          set -euo pipefail
          case "$STORAGE_SUITE" in
            full|bridge-recheck) printf 'STORAGE SUITE: %s\n' "$STORAGE_SUITE" ;;
            *) echo INVALID_STORAGE_SUITE; exit 1 ;;
          esac

      # Baseline, then the run, then the audit against that baseline. The
      # in-module STORAGE_PG_CONTRACT_REQUIRED guard only covers a missing
      # database: it is a `throw` inside the test modules, so it cannot fire if
      # vitest stops collecting them, and collection is decided by storage's
      # vitest.config.ts — a file no publishable-input rule covers, so excluding
      # `*.pg.test.ts` there would silence this whole job while it still
      # reported success.
      - name: Storage PostgreSQL contract
        if: env.STORAGE_SUITE == 'full'
        env:
          STORAGE_VITEST_RESULTS: ${{ runner.temp }}/storage-vitest.json
          STORAGE_PG_BASELINE: ${{ runner.temp }}/storage-pg-baseline.json
        run: |
          set -euo pipefail
          node scripts/assert-pg-contract-suites.mjs --capture-baseline "$STORAGE_PG_BASELINE"
          pnpm --filter @openmaic/storage exec \
            vitest run --reporter=default --reporter=json \
            --outputFile.json="$STORAGE_VITEST_RESULTS"
          node scripts/assert-pg-contract-suites.mjs "$STORAGE_VITEST_RESULTS" \
            --baseline "$STORAGE_PG_BASELINE"

      # App-domain PostgreSQL contracts, in the same database as the package
      # suite above. Each of these files is responsible for not colliding with
      # it: the asset ones provision `stage_meta`, whose foreign key to
      # `document_stages` would break the package suite's non-cascading
      # TRUNCATE, so each works inside a schema of its own and drops it again.
      # Both orders were checked, because nothing here guarantees one.
      - name: App-domain PostgreSQL contracts
        if: env.STORAGE_SUITE == 'full'
        run: |
          pnpm exec vitest run \
            tests/lib/whiteboard/runtime-store.pg.test.ts \
            tests/persistence/document-asset-references.pg.test.ts \
            tests/persistence/asset-reference-backfill.pg.test.ts \
            tests/persistence/workbench-tool-asset-references.pg.test.ts

      - name: Diagnostic setup — exact official reference and browser
        run: |
          git -c http.version=HTTP/1.1 fetch --no-tags --depth=1 https://github.com/THU-MAIC/OpenMAIC.git 1f05a70ac93e09c67fb4d3aafb9c2b068d14fcce
          test "$(git rev-parse FETCH_HEAD)" = "1f05a70ac93e09c67fb4d3aafb9c2b068d14fcce"
          pnpm exec playwright install --with-deps chromium

      - name: OpenMAIC isolated diagnostics — fresh artifacts, two passes
        if: env.STORAGE_SUITE == 'full'
        shell: bash
        run: |
          set -euo pipefail
          setup_log="$RUNNER_TEMP/b0-setup.log"
          node tests/zhiban/openmaic/prepare-workspace.mjs | tee "$setup_log"
          diagnostic_workspace="$(sed -n 's/^DIAGNOSTIC_WORKSPACE=//p' "$setup_log")"
          test -n "$diagnostic_workspace"
          trap 'node "$GITHUB_WORKSPACE/tests/zhiban/openmaic/cleanup-workspace.mjs" "$diagnostic_workspace"' EXIT
          cd "$diagnostic_workspace"
          pnpm exec tsc -p tests/zhiban/openmaic/tsconfig.json
          node tests/zhiban/openmaic/run-diagnostics.mjs
          # Additive B9 evidence uses the same newly built official artifacts.
          mkdir -p "$diagnostic_workspace/lib"
          cp -R "$GITHUB_WORKSPACE/lib/zhiban" "$diagnostic_workspace/lib/"
          mkdir -p "$diagnostic_workspace/tests/zhiban/bridge"
          cp -R "$GITHUB_WORKSPACE/tests/zhiban/bridge/." "$diagnostic_workspace/tests/zhiban/bridge/"
          for pass in 1 2; do
            echo "B9 NATIVE/BROWSER PG16 RUN ${pass}"
            B9_NATIVE_REQUIRED=1 B9_BROWSER_REQUIRED=1 pnpm exec vitest run --config tests/zhiban/bridge/vitest.config.ts --reporter=verbose
            echo "B9 NATIVE/BROWSER PG16 RUN ${pass} PASS"
          done
      # Rebuild the pinned official artifacts, then run only the native contract
      # blocked by the prior bootstrap failure. Prior diagnostics/browser proof is retained.
      - name: Bridge native PostgreSQL 16 recheck (two runs)
        if: env.STORAGE_SUITE == 'bridge-recheck'
        shell: bash
        run: |
          set -euo pipefail
          setup_log="$RUNNER_TEMP/b9-setup.log"
          node tests/zhiban/openmaic/prepare-workspace.mjs | tee "$setup_log"
          diagnostic_workspace="$(sed -n 's/^DIAGNOSTIC_WORKSPACE=//p' "$setup_log")"
          test -n "$diagnostic_workspace"
          trap 'node "$GITHUB_WORKSPACE/tests/zhiban/openmaic/cleanup-workspace.mjs" "$diagnostic_workspace"' EXIT
          cd "$diagnostic_workspace"
          pnpm exec tsc -p tests/zhiban/openmaic/tsconfig.json
          mkdir -p "$diagnostic_workspace/lib"
          cp -R "$GITHUB_WORKSPACE/lib/zhiban" "$diagnostic_workspace/lib/"
          mkdir -p "$diagnostic_workspace/tests/zhiban/bridge"
          cp -R "$GITHUB_WORKSPACE/tests/zhiban/bridge/." "$diagnostic_workspace/tests/zhiban/bridge/"
          for pass in 1 2; do
            echo "B9 NATIVE PG16 RECHECK RUN ${pass}"
            B9_NATIVE_REQUIRED=1 pnpm exec vitest run --config tests/zhiban/bridge/vitest.config.ts tests/zhiban/bridge/native-pg.test.ts --reporter=verbose
            echo "B9 NATIVE PG16 RECHECK RUN ${pass} PASS"
          done
